{% extends 'base.html' %} {% block title %}Login - NepalJobs{% endblock %} 
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <h2 class="mb-4">Login</h2>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% include 'includes/form_fields.html' %}
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
    <p class="mt-3">No account? <a href="{% url 'register' %}">Register</a></p>
  </div>
</div>
{% endblock %}
