{% extends 'base.html' %} {% block title %}Register - NepalJobs{% endblock %} 
{% block content %}
<h2 class="mb-4 text-center">Join NepalJobs</h2>
<div class="row justify-content-center g-4">
  <div class="col-md-4">
    <div class="card h-100 text-center p-4">
      <h4>I'm looking for a job</h4>
      <p class="text-muted">Create a profile, search jobs and apply.</p>
      <a class="btn btn-primary" href="{% url 'register_jobseeker' %}"
        >Register as Jobseeker</a
      >
    </div>
  </div>
  <div class="col-md-4">
    <div class="card h-100 text-center p-4">
      <h4>I'm hiring</h4>
      <p class="text-muted">Register your company and post vacancies.</p>
      <a class="btn btn-outline-primary" href="{% url 'register_employer' %}"
        >Register as Employer</a
      >
    </div>
  </div>
</div>
{% endblock %}
