{% extends 'base.html' %}

{% block title %}Edit Skills - NepalJobs{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <a class="text-decoration-none small" href="{% url 'profile' %}">&larr; Back to profile</a>
    <h2 class="mt-2 mb-4">Edit skills</h2>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% include 'includes/form_fields.html' %}
          <div class="d-flex gap-2">
            <button class="btn btn-primary" type="submit">Save skills</button>
            <a class="btn btn-outline-secondary" href="{% url 'profile' %}">Cancel</a>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
