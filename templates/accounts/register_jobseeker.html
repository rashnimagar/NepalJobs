{% extends 'base.html' %} {% block title %}Jobseeker Registration{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-4">Register as Jobseeker</h2>
    <div class="card">
      <div class="card-body p-4">
        <form method="post">
          {% csrf_token %}
          {% include 'includes/form_fields.html' %}
          <button class="btn btn-primary w-100" type="submit">Create Account</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
